<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Cafuné · Painel do dono</title>
<link rel="icon" href="/icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#FAF6EE;--card:#fff;--ink:#5A3524;--ink2:#8A6450;--yel:#F7D96B;--yel2:#FBEFB5;--ok:#3E8E5E;--err:#B5452F;--line:#EFE4D2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:600 15px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif}
.w{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px 40px}
h1{font-size:22px;font-weight:900;margin:0 0 2px}
h2{font-size:16px;font-weight:900;margin:22px 0 8px}
.sub{color:var(--ink2);margin:0 0 12px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.k{background:var(--card);border-radius:14px;padding:10px;box-shadow:0 1px 0 var(--line)}
.k b{display:block;font-size:24px;font-weight:900}
.k span{font-size:12px;color:var(--ink2)}
.k.hl{background:var(--yel2)}
.card{background:var(--card);border-radius:14px;padding:12px;box-shadow:0 1px 0 var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;color:var(--ink2);font-weight:800}
.scroll{overflow-x:auto}
input,select{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;background:#fff;color:inherit}
.row{display:flex;gap:8px;margin-top:8px}
.row>*{flex:1}
.btn{border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:900;background:var(--yel);color:var(--ink);cursor:pointer}
.btn.sec{background:var(--yel2)}
.btn.mini{padding:6px 10px;font-size:12px}
.msg{font-size:13px;margin:8px 0 0;min-height:18px}
.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
.of{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.of:last-child{border:0}
.muted{color:var(--ink2);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
code{background:var(--yel2);padding:2px 6px;border-radius:6px;font-size:12px;word-break:break-all}
</style>
</head>
<body>
<div class="w" id="w"><p class="muted">A carregar…</p></div>
<script>
const SB_URL='https://hdjfvoojxewceskiuoaj.supabase.co', SB_KEY='sb_publishable_1AlhtIB1IX9VosyK4L_RLw_8TAdnqqg';
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const W=document.getElementById('w');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dia=d=>{const x=new Date(d+'T12:00:00');return x.toLocaleDateString('pt-PT',{weekday:'short',day:'numeric',month:'numeric'})};
const dinheiro=(v,m)=>(v/100).toLocaleString('pt-PT',{style:'currency',currency:(m||'eur').toUpperCase()});

function login(){
  W.innerHTML=`<h1>Painel do dono 🦥</h1><p class="sub">Entra com o mesmo email da tua conta Cafuné.</p>
  <div class="card"><input id="em" type="email" placeholder="email" autocomplete="email" inputmode="email">
  <div class="row"><button class="btn" id="env">Enviar código</button></div><p class="msg" id="m"></p></div>`;
  const m=document.getElementById('m');
  document.getElementById('env').onclick=async()=>{
    const email=document.getElementById('em').value.trim().toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){m.className='msg err';m.textContent='Email inválido.';return}
    m.className='msg';m.textContent='A enviar…';
    const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false}});
    if(error){m.className='msg err';m.textContent=/rate|seconds/i.test(error.message)?'Espera um minuto e tenta de novo.':'Não foi possível enviar ('+error.message+').';return}
    W.querySelector('.card').innerHTML=`<p class="muted">Código de 6 dígitos enviado para <b>${esc(email)}</b> (vê também o spam).</p>
      <input id="cd" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
      <div class="row"><button class="btn" id="ok">Entrar</button></div><p class="msg" id="m2"></p>`;
    const cd=document.getElementById('cd'),m2=document.getElementById('m2');
    const ver=async()=>{const token=cd.value.replace(/\D/g,'');if(token.length!==6){m2.className='msg err';m2.textContent='São 6 números.';return}
      m2.className='msg';m2.textContent='A verificar…';
      const {error:e}=await sb.auth.verifyOtp({email,token,type:'email'});
      if(e){m2.className='msg err';m2.textContent='Código errado ou expirado.';return}
      carregar();};
    document.getElementById('ok').onclick=ver;
    cd.addEventListener('input',()=>{if(cd.value.replace(/\D/g,'').length===6)ver()});cd.focus();
  };
}

async function carregar(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return login();
  const {data,error}=await sb.rpc('dono_dados');
  if(error){W.innerHTML=`<p class="msg err">Erro: ${esc(error.message)}</p>`;return}
  if(!data.dono){
    W.innerHTML=`<h1>Quase lá</h1><p class="sub">Esta conta ainda não está autorizada como dona.</p>
    <div class="card"><p class="muted">Diz ao Claude este código para te autorizar:</p><p><code id="uid">${esc(data.uid)}</code></p>
    <div class="row"><button class="btn sec" id="cp">Copiar</button><button class="btn sec" id="out">Sair</button></div></div>`;
    document.getElementById('cp').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(data.uid)};
    document.getElementById('out').onclick=async()=>{await sb.auth.signOut();login()};
    return;
  }
  render(data);
}

function render(d){
  const h=d.dias[0]||{}, sem=d.dias.slice(0,7), t=d.totais;
  const soma=k=>sem.reduce((a,x)=>a+(+x[k]||0),0);
  const hojeISO=new Date().toISOString().slice(0,10);
  const hj=h.dia===hojeISO?h:{};
  const receita=d.receita.length?d.receita.map(r=>dinheiro(r.total,r.moeda)).join(' · '):'0 €';
  const v=d.voltaram[0];
  W.innerHTML=`<div class="top"><div><h1>Painel do dono 🦥</h1><p class="sub">Atualizado ${new Date(d.agora).toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'})}</p></div>
    <button class="btn sec mini" id="rf">↻</button></div>
  <h2>Hoje</h2>
  <div class="grid">
    <div class="k hl"><b>${hj.pessoas_ativas||0}</b><span>pessoas na app</span></div>
    <div class="k"><b>${hj.novos_dudus||0}</b><span>Dudus novos</span></div>
    <div class="k"><b>${hj.passinhos||0}</b><span>passinhos</span></div>
    <div class="k"><b>${hj.contas_criadas||0}</b><span>contas criadas</span></div>
    <div class="k"><b>${hj.convites||0}</b><span>convites</span></div>
    <div class="k hl"><b>${hj.pagamentos||0}</b><span>pagamentos</span></div>
  </div>
  <h2>Últimos 7 dias</h2>
  <div class="grid">
    <div class="k"><b>${soma('novos_dudus')}</b><span>Dudus novos</span></div>
    <div class="k"><b>${soma('passinhos')}</b><span>passinhos</span></div>
    <div class="k"><b>${soma('cliques_plus')}</b><span>cliques no Plus</span></div>
    <div class="k"><b>${v?v.voltaram+'/'+v.abriram:'–'}</b><span>voltaram no dia seguinte (ontem)</span></div>
    <div class="k"><b>${soma('convites')}</b><span>convites</span></div>
    <div class="k"><b>${soma('lembretes_ligados')}</b><span>lembretes ligados</span></div>
  </div>
  <h2>Dinheiro</h2>
  <div class="grid">
    <div class="k hl"><b style="font-size:18px">${receita}</b><span>receita total (real)</span></div>
    <div class="k"><b>${t.plus_pagos}</b><span>Plus pagos ativos</span></div>
    <div class="k"><b>${t.compras}</b><span>compras avulsas</span></div>
  </div>
  ${d.pagamentos.length?`<div class="card" style="margin-top:8px">${d.pagamentos.map(p=>`<div class="of"><span>${new Date(p.criado_em).toLocaleString('pt-PT',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})} · ${esc(p.tipo||'')}</span><b>${dinheiro(p.valor,p.moeda)}</b></div>`).join('')}</div>`:''}
  <h2>Totais</h2>
  <div class="grid">
    <div class="k"><b>${t.dudus}</b><span>Dudus criados</span></div>
    <div class="k"><b>${t.contas}</b><span>contas com email</span></div>
    <div class="k"><b>${t.amizades}</b><span>amizades</span></div>
  </div>
  <h2>Dia a dia</h2>
  <div class="card scroll"><table><tr><th>Dia</th><th>Pessoas</th><th>Novos</th><th>Contas</th><th>Passos</th><th>Plus</th><th>€</th></tr>
  ${d.dias.map(x=>`<tr><td>${dia(x.dia)}</td><td>${x.pessoas_ativas}</td><td>${x.novos_dudus}</td><td>${x.contas_criadas}</td><td>${x.passinhos}</td><td>${x.cliques_plus}</td><td>${x.pagamentos}</td></tr>`).join('')}</table></div>
  <h2>Cafuné+ oferecido</h2>
  <div class="card">
    <p class="muted" style="margin:0 0 8px">A pessoa precisa de ter conta na app (botão "Salvar meu Dudu" nas definições).</p>
    <input id="oe" type="email" placeholder="email da pessoa" inputmode="email">
    <div class="row"><select id="od"><option value="30">1 mês</option><option value="90">3 meses</option><option value="365">1 ano</option><option value="0">Para sempre</option></select>
    <button class="btn" id="ob">Oferecer</button></div><p class="msg" id="om"></p>
    <div id="ol" style="margin-top:6px">${d.ofertas.length?d.ofertas.map(o=>`<div class="of"><span>${esc(o.email)}<br><span class="muted">${new Date(o.valido_ate).getFullYear()>=2099?'para sempre':'até '+new Date(o.valido_ate).toLocaleDateString('pt-PT')}</span></span><button class="btn sec mini" data-u="${esc(o.user_id)}">Retirar</button></div>`).join(''):'<p class="muted">Ainda não ofereceste a ninguém.</p>'}</div>
  </div>
  <p style="text-align:center;margin-top:24px"><button class="btn sec mini" id="out">Sair</button></p>`;
  document.getElementById('rf').onclick=carregar;
  document.getElementById('out').onclick=async()=>{await sb.auth.signOut();login()};
  const om=document.getElementById('om');
  document.getElementById('ob').onclick=async()=>{
    const email=document.getElementById('oe').value.trim();
    if(!email){om.className='msg err';om.textContent='Escreve o email.';return}
    om.className='msg';om.textContent='A oferecer…';
    const {data:r,error}=await sb.rpc('dono_oferecer',{p_email:email,p_dias:+document.getElementById('od').value});
    if(error){om.className='msg err';om.textContent=error.message;return}
    if(!r.ok){om.className='msg err';om.textContent=r.erro==='sem_conta'?'Não há conta com esse email. Pede-lhe para tocar em "Salvar meu Dudu" na app primeiro.':'Essa pessoa já paga o Plus.';return}
    om.className='msg ok';om.textContent='Feito! 💛';setTimeout(carregar,700);
  };
  document.querySelectorAll('[data-u]').forEach(b=>b.onclick=async()=>{
    if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='Confirmar?';return}
    await sb.rpc('dono_retirar',{p_user:b.dataset.u});carregar();
  });
}
carregar();
</script>
</body>
</html>
